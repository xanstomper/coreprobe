name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          # libusbmuxd-utils was folded into libusbmuxd-tools on newer runners;
          # fall back per-package so one rename can't kill the whole install.
          for pkg in libimobiledevice-utils libusbmuxd-tools libusbmuxd-utils \
            irecovery libusb-1.0-0-dev g++ cmake sqlite3; do
            sudo apt-get install -y -qq "$pkg" || echo "skip $pkg (unavailable)"
          done

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pymobiledevice3 pyusb capstone

      - name: Build native core
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ./build/osleuth_core selftest

      - name: Run tests (non-Qt)
        run: |
          python -m pytest tests/ -q -k "not test_desktop" --ignore=tests/test_desktop.py

      - name: Syntax check web assets
        run: node --check opensleuth/studio_web/static/app.js